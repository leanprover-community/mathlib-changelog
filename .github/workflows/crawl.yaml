name: crawl
on:
  schedule:
    - cron: "35 03 * * *"
  workflow_dispatch:
jobs:
  update_changelogs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
      - name: Install dependencies
        run: poetry install --no-interaction
        working-directory: ./crawler
      # Only commits newer than the latest one already in the changelog are
      # crawled, so this stays fast without a persisted parse cache.
      - name: crawl git repos to update changelog files
        run: poetry run python -m crawler.crawl
        working-directory: ./crawler
      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "Updating CHANGELOG"
          file_pattern: "CHANGELOG.v3.full.json CHANGELOG.v3.full.txt CHANGELOG.v4.full.json CHANGELOG.v4.full.txt"
          commit_author: github-actions[bot] <actions@github.com>
