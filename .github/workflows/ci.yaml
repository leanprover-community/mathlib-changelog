name: CI
on: [push]
jobs:
  lint_and_test_crawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.10"
      - name: Install Poetry
        uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1
      - name: Install dependencies
        run: poetry install --no-interaction
        working-directory: ./crawler
      - name: flake8 linting
        run: poetry run flake8 .
        working-directory: ./crawler
      - name: black code formatting
        run: poetry run black . --check
        working-directory: ./crawler
      - name: mypy type checking
        run: poetry run mypy .
        working-directory: ./crawler
      - name: pytest
        run: poetry run pytest
        working-directory: ./crawler
  lint_and_test_website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: yarn install --frozen-lockfile
        working-directory: ./website
      - run: yarn lint
        working-directory: ./website
      - run: yarn build
        working-directory: ./website
      # Build for Cloudflare Workers too (OpenNext), so changes that break
      # either deploy target fail here.
      - run: yarn cf:build
        working-directory: ./website
